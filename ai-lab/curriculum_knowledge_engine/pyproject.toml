[project]
name = "curriculum-knowledge-engine"
version = "0.1.0"
description = "Enterprise curriculum knowledge engine: hybrid RAG + GraphRAG over ingested curricula, plus graph-driven learning paths."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "networkx>=3.3",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
neo4j = ["neo4j>=5.20"]
postgres = ["psycopg[binary]>=3.1", "pgvector>=0.3"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[project.scripts]
cke = "cke.cli.main:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
